name: 构建 mdBook 并部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Prepare book source
        run: |
          mkdir -p src/daily
          if ls daily/*.md 2>/dev/null; then
            for f in daily/*.md; do
              cp "$f" "src/daily/$(basename "$f")"
            done
          fi

          echo '# 目录' > src/SUMMARY.md
          echo '' >> src/SUMMARY.md
          echo '[首页](README.md)' >> src/SUMMARY.md
          echo '[今日日报](daily/latest.md)' >> src/SUMMARY.md
          echo '---' >> src/SUMMARY.md
          echo '' >> src/SUMMARY.md
          echo '- [日报归档](daily/index.md)' >> src/SUMMARY.md

          if ls -r daily/*.md 2>/dev/null; then
            echo '---' >> src/SUMMARY.md
            for f in $(ls -r daily/*.md); do
              name=$(basename "$f" .md)
              if [ "$name" != "latest" ]; then
                echo "  - [$name](daily/$name.md)" >> src/SUMMARY.md
              fi
            done
          fi

          echo '# 日报归档' > src/daily/index.md
          echo '' >> src/daily/index.md
          if ls -r daily/*.md 2>/dev/null; then
            for f in $(ls -r daily/*.md); do
              name=$(basename "$f" .md)
              if [ "$name" != "latest" ]; then
                echo "- [$name](daily/$name.md)" >> src/daily/index.md
              fi
            done
          fi

          echo '# 今日日报' > src/daily/latest.md
          echo '' >> src/daily/latest.md
          if [ -f daily/latest.md ]; then
            cat daily/latest.md >> src/daily/latest.md
          else
            echo '暂无内容' >> src/daily/latest.md
          fi

      - name: Build mdBook
        run: mdbook build

      - name: Deploy to GitHub Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cp -r book/. /tmp/gh-pages/
          cd /tmp/gh-pages
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git config user.name "aisec-bot"
          git config user.email "bot@aisec.dev"
          git add .
          git commit -m "deploy $(date +%Y-%m-%d)"
          git remote add origin https://x-access-token:${TOKEN}@github.com/${REPO}.git
          git push -f origin gh-pages
