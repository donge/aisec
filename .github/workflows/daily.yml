name: 每日生成日报

on:
  schedule:
    # 每天 UTC 15:00 = 北京时间 23:00
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，为空则使用当天'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成日报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node src/daily.js

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Build site
        run: |
          mkdir -p src/daily
          if ls daily/*.md 2>/dev/null; then
            for f in daily/*.md; do
              cp "$f" "src/daily/$(basename "$f")"
            done
          fi
          echo '# 目录' > src/SUMMARY.md
          echo '' >> src/SUMMARY.md
          echo '[首页](README.md)' >> src/SUMMARY.md
          echo '[今日日报](daily/latest.md)' >> src/SUMMARY.md
          echo '---' >> src/SUMMARY.md
          echo '- [日报归档](daily/index.md)' >> src/SUMMARY.md
          if ls -r daily/*.md 2>/dev/null; then
            echo '---' >> src/SUMMARY.md
            for f in $(ls -r daily/*.md); do
              name=$(basename "$f" .md)
              if [ "$name" != "latest" ]; then
                echo "  - [$name](daily/$name.md)" >> src/SUMMARY.md
              fi
            done
          fi
          echo '# 日报归档' > src/daily/index.md
          if ls -r daily/*.md 2>/dev/null; then
            for f in $(ls -r daily/*.md); do
              name=$(basename "$f" .md)
              if [ "$name" != "latest" ]; then
                echo "- [$name](daily/$name.md)" >> src/daily/index.md
              fi
            done
          fi
          echo '# 今日日报' > src/daily/latest.md
          if [ -f daily/latest.md ]; then
            cat daily/latest.md >> src/daily/latest.md
          fi
          mdbook build

      - name: 提交到仓库
        run: |
          git config user.name "aisec-bot"
          git config user.email "bot@aisec.dev"
          git add -A
          git diff --staged --quiet || git commit -m "📰 日报 $(date +%Y-%m-%d)"
          git push
